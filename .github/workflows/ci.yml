name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      # Zero tolerance for undefined names + syntax errors tree-wide.
      # (Full style cleanup of legacy files is backlog, not a gate.)
      - run: ruff check backtester analysis strategies data mcp_server.py run_pipeline.py --select F821,E9
      - run: python -m py_compile backtester/*.py analysis/permutation_test.py analysis/review_gate.py analysis/auto_iterate.py analysis/walkforward_v2.py analysis/universe_screener.py analysis/competition_study.py mcp_server.py run_pipeline.py

  test:
    runs-on: ubuntu-latest
    needs: lint
    env:
      FIXTURE_SYMBOLS: EURUSD,ETHUSDT
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pytest
      - run: python tests/fetch_ci_fixture.py
      - run: python -m pytest tests/test_analysis_units.py -q
      - run: python -m tests
