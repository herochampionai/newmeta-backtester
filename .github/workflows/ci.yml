name: Newmeta Backtester CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  PYTHONUTF8: 1

jobs:
  lint-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov ruff mypy
      - name: Ruff lint
        run: ruff check .
      - name: Type check (mypy)
        run: mypy --ignore-missing-imports backtester/ analysis/ frontend/ || true
      - name: Unit tests
        run: pytest tests/ -v --tb=short -x --cov=backtester --cov=analysis --cov-report=xml
      - name: Smoke tick engine
        run: python tests/smoke_tick_engine.py

  parity-smoke:
    runs-on: ubuntu-latest
    needs: lint-test
    if: false  # enable when MT5 runner available in CI
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Parity smoke (requires MT5)
        run: |
          python -c "
          from backtester.parity import strict_parity_test
          # Requires MT5 terminal + deals — skip in CI
          print('Parity test needs MT5 terminal — run locally')
          "

  build-docs:
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4
      - name: Build HTML reports
        run: |
          python -c "
          from backtester.pro_suite import export_report
          print('Report export OK')
          "

  notify:
    runs-on: ubuntu-latest
    needs: [lint-test, parity-smoke, build-docs]
    if: always()
    steps:
      - name: Status
        run: |
          echo "CI completed: ${{ needs.lint-test.result }}, ${{ needs.parity-smoke.result }}, ${{ needs.build-docs.result }}"