# Strategies config — ranges aligned with `multi strat newmeta.mq5` inputs.
# Each strategy has its own section mirroring the .mq5 input block.
# Optuna samples from these ranges.

common:
  symbol: EURUSD
  timeframe: H1
  start: '2020-01-01'
  end: '2024-12-31'
  initial_cash: 10000.0
  commission: 0.00007   # 0.7 pip round-turn on EURUSD typical
  slippage: 0.00003     # 0.3 pip
  leverage: 30

ac_ao:                                  # AC+AO COMBO Strategy (MERGED)
  enabled: true
  open_orders_type:  [1, 8]             # 0=off, 1-8 patterns
  close_orders_type: [0, 8]
  level_open_orders:  [50, 95]
  level_close_orders: [40, 90]
  use_acceleration_filter: [true, false]
  min_acceleration:     [0.0001, 0.002]
  acceleration_bars:    [2, 6]
  use_ao_synchronization: [true, false]
  min_ao_synchronization: [0.0001, 0.001]
  take_profit:  [20, 150]
  stop_loss:    [20, 150]
  use_break_even: [true, false]
  break_even_activate: [2, 8]
  break_even_buffer:   [1, 4]
  use_trailing:        [true, false]
  trailing_start:      [8, 30]
  trailing_pips:       [10, 40]

adx:                                    # ADX ENHANCED
  enabled: true
  bars_calculate: [14, 30]
  open_orders_type:  [0, 4]
  level_open_orders_1: [40, 80]
  level_open_orders_2: [10, 30]
  close_orders_type:  [0, 4]
  level_close_orders_1: [10, 25]
  level_close_orders_2: [3, 15]
  use_di_crossover: [true, false]
  crossover_lookback: [2, 6]
  min_crossover_gap: [3, 10]
  take_profit:  [20, 80]
  stop_loss:    [40, 120]

dem:                                    # DeM ORIGINAL
  enabled: true
  bars_calculate: [10, 30]
  open_orders_type: [0, 4]
  level_open_orders: [50, 90]
  close_orders_type: [0, 4]
  level_close_orders: [50, 90]
  take_profit:  [3, 25]
  stop_loss:    [30, 100]

fbb:                                    # FBB ORIGINAL (Bollinger)
  enabled: true
  bars_calculate: [15, 30]
  deviation: [1.0, 3.0]
  open_orders_type_1: [0, 2]
  open_orders_type_2: [0, 8]
  level_open_orders_1: [-50, 50]
  level_open_orders_2: [20, 90]
  close_orders_type_1: [0, 2]
  close_orders_type_2: [0, 8]
  level_close_orders_1: [20, 90]
  level_close_orders_2: [20, 90]
  take_profit:  [3, 30]
  stop_loss:    [5, 60]

mfi:                                    # MFI ENHANCED
  enabled: true
  bars_calculate: [8, 20]
  open_orders_type: [0, 4]
  level_open_orders: [70, 95]
  close_orders_type: [0, 4]
  level_close_orders: [70, 95]
  use_slope_filter: [true, false]
  min_slope_strength: [1, 8]
  slope_lookback: [3, 8]
  use_divergence: [true, false]
  use_hidden_divergence: [true, false]
  divergence_bars: [5, 20]
  take_profit:  [20, 100]
  stop_loss:    [10, 60]

ms:                                     # MS ENHANCED (MACD+Stoch)
  enabled: true
  fast_ema_period: [2, 8]
  slow_ema_period: [6, 15]
  signal_period:   [1, 5]
  k_period:        [3, 10]
  d_period:        [2, 6]
  slowing_period:  [5, 20]
  open_orders_type_1: [0, 11]
  open_orders_type_2: [0, 28]
  level_open_orders_1: [30, 80]
  level_open_orders_2: [50, 95]
  close_orders_type_1: [0, 11]
  close_orders_type_2: [0, 28]
  level_close_orders_1: [20, 70]
  level_close_orders_2: [40, 85]
  use_confluence_filter: [true, false]
  use_macd_divergence: [true, false]
  use_stoch_divergence: [true, false]
  use_histogram_divergence: [true, false]
  take_profit:  [5, 40]
  stop_loss:    [20, 80]

# Global risk / allocation knobs
allocation:
  method: markowitz            # markowitz | risk_parity | equal | kelly
  max_weight: 0.40             # per-strategy cap
  max_drawdown_constraint: 0.15
  shrinkage: ledoit_wolf       # covariance estimator
  rebalance: monthly           # W | M | Q

optimization:
  n_trials: 200
  sampler: tpe                 # tpe | cmaes | random
  multi_objective: true
  objectives: [sharpe, calmar]
  walk_forward:
    enabled: true
    train_years: 3
    test_months: 6
    roll_months: 3
  monte_carlo:
    n_simulations: 5000
    confidence: 0.95